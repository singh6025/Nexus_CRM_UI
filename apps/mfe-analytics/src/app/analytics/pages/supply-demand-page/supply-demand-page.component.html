<div class="supply-demand-page">
  <header class="page-header">
    <button mat-icon-button routerLink="/analytics" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Supply &amp; Demand</h1>
  </header>

  <div class="filters" [formGroup]="filters">
    <mat-form-field appearance="outline" class="filter-search">
      <mat-label>Search commodity</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput formControlName="search" />
    </mat-form-field>
  </div>

  <farmeasy-data-table
    [columns]="columns"
    [data]="rows()"
    [total]="total()"
    [page]="page()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    (sortChange)="onSort($event)"
    (pageChange)="onPage($event)"
  />
</div>
